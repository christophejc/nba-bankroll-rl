[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-bankroll-rl"
version = "0.1.0"
description = "Chronological NBA moneyline bankroll experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
rl = ["torch>=2.2"]

[project.scripts]
nba-bankroll = "nba_bankroll.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
